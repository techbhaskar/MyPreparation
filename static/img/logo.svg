<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagon / Shield -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="none" stroke="url(#cyber-grad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Inner Node Architecture Network -->
  <circle cx="50" cy="30" r="7" fill="#06b6d4" />
  <circle cx="30" cy="65" r="7" fill="#3b82f6" />
  <circle cx="70" cy="65" r="7" fill="#8b5cf6" />
  
  <!-- Connections -->
  <line x1="50" y1="30" x2="30" y2="65" stroke="url(#cyber-grad)" stroke-width="3" opacity="0.8" />
  <line x1="50" y1="30" x2="70" y2="65" stroke="url(#cyber-grad)" stroke-width="3" opacity="0.8" />
  <line x1="30" y1="65" x2="70" y2="65" stroke="url(#cyber-grad)" stroke-width="3" opacity="0.8" />
  
  <!-- Center Core -->
  <circle cx="50" cy="53" r="5" fill="#ffffff" />
</svg>
